<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroRoulette — 뇌과학 의사결정 연구</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap');

:root{
  --bg:#0a0908;
  --bg2:#141210;
  --panel:#181513;
  --line:#2b2422;
  --red:#b81f2a;
  --red2:#7c1219;
  --red-glow:#e63946;
  --text:#f2ece6;
  --muted:#a89890;
  --muted2:#6f625c;
  --gold:#d9a441;
  --font-display:'Noto Serif KR', 'Noto Sans KR', serif;
  --font-body:'Noto Sans KR', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(184,31,42,.10), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(184,31,42,.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:400;
  min-height:100vh;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px; margin:0 auto; padding:0 32px;}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:900; letter-spacing:-.5px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}

/* ===== Header ===== */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(10,9,8,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 32px; max-width:1280px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:38px; height:38px; border:2px solid var(--red); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--red);}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:0;}
.brand-name span{color:var(--red);}
.brand-sub{font-size:10px; letter-spacing:2.5px; color:var(--muted2); margin-top:1px; font-weight:500;}
nav{display:flex; gap:30px;}
nav a{font-size:14px; color:var(--muted); padding:6px 2px; border-bottom:2px solid transparent; transition:.15s; font-weight:500;}
nav a.active, nav a:hover{color:var(--text); border-color:var(--red);}
.participant-chip{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); padding:8px 14px; border-radius:20px; font-size:12px; color:var(--muted);}
.participant-chip b{color:var(--gold); font-weight:700; letter-spacing:.5px;}

/* ===== Buttons ===== */
.btn-primary{
  background:linear-gradient(180deg, var(--red) 0%, var(--red2) 100%);
  color:#fff; border:none; padding:14px 26px; border-radius:8px; font-weight:700; font-size:15px;
  box-shadow:0 6px 20px rgba(184,31,42,.35);
  display:inline-flex; align-items:center; gap:8px;
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.35; box-shadow:none; cursor:not-allowed;}
.btn-secondary{
  background:transparent; border:1px solid var(--line); color:var(--text);
  padding:14px 26px; border-radius:8px; font-weight:700; font-size:15px;
  display:inline-flex; align-items:center; gap:8px;
}
.btn-secondary:hover{border-color:var(--muted);}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--muted); padding:9px 16px; border-radius:6px; font-size:13px; font-weight:600;}
.btn-ghost:hover{color:var(--text); border-color:var(--muted);}

/* ===== Home Hero ===== */
.hero{padding:80px 0 60px; display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;}
.eyebrow{color:var(--red); font-size:13px; margin-bottom:18px; font-weight:700; letter-spacing:1.5px; font-family:var(--font-body);}
.hero h1{font-size:54px; line-height:1.22; margin-bottom:22px; font-weight:900;}
.hero h1 .accent{color:var(--red); text-shadow:0 0 30px rgba(184,31,42,.4);}
.hero p{color:var(--muted); font-size:16px; margin-bottom:30px; max-width:440px; font-weight:400;}
.hero-actions{display:flex; gap:14px;}

.wheel-stage{position:relative; display:flex; align-items:center; justify-content:center;}
.wheel-outer{position:relative; width:380px; height:380px;}
.wheel-pointer{position:absolute; top:-14px; left:50%; transform:translateX(-50%); z-index:5; font-size:30px; color:var(--red); filter:drop-shadow(0 0 8px rgba(184,31,42,.6));}
.wheel-ring{position:absolute; inset:0; border-radius:50%; border:6px solid #241f1d; box-shadow:0 0 0 2px #3a3230, 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(184,31,42,.15);}
.wheel-face{
  position:absolute; inset:14px; border-radius:50%; overflow:hidden;
  will-change:transform, filter;
  transform-origin:50% 50%;
}
.wheel-slice-icon{position:absolute; top:50%; left:50%; font-size:18px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; text-align:center; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.wheel-outer.spinning .wheel-pointer{animation:pointerTick .18s ease-in-out infinite alternate;}
.wheel-outer.spinning .wheel-ring{box-shadow:0 0 0 2px #3a3230,0 20px 70px rgba(184,31,42,.45),inset 0 0 45px rgba(184,31,42,.28);}
.wheel-outer.spinning .wheel-hub{animation:hubPulse .7s ease-in-out infinite alternate;}
@keyframes pointerTick{from{transform:translateX(-50%) rotate(-5deg) translateY(0)}to{transform:translateX(-50%) rotate(5deg) translateY(4px)}}
@keyframes hubPulse{from{box-shadow:0 0 20px rgba(184,31,42,.3)}to{box-shadow:0 0 42px rgba(230,57,70,.75)}}
.wheel-hub{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:110px; height:110px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #1c1614, #0c0908);
  border:3px solid #3a2f2c; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-body); font-weight:900; color:var(--red); font-size:18px; letter-spacing:1.5px;
  box-shadow:0 0 25px rgba(184,31,42,.35); z-index:6;
}
.wheel-hub.clickable{cursor:pointer;}
.wheel-hub.clickable:hover{color:var(--red-glow);}
.wheel-hub:disabled{opacity:.4;}

/* stats bar */
.stats-bar{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:50px 0;}
.stat-cell{display:flex; align-items:center; gap:14px; padding:24px 30px; border-right:1px solid var(--line);}
.stat-cell:last-child{border-right:none;}
.stat-icon{color:var(--red); font-size:20px;}
.stat-label{font-size:12px; color:var(--muted2); font-weight:500;}
.stat-value{font-family:var(--font-display); font-size:23px; font-weight:900; color:var(--red);}

.section-title{text-align:center; font-size:13px; letter-spacing:3px; color:var(--muted); margin:60px 0 30px; display:flex; align-items:center; gap:14px; justify-content:center; font-weight:600;}
.section-title::before, .section-title::after{content:''; width:60px; height:1px; background:var(--line);}

.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:70px;}
.step-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px; position:relative;}
.step-num{position:absolute; top:-12px; left:20px; background:var(--red); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;}
.step-icon{font-size:22px; color:var(--red); margin:6px 0 14px;}
.step-card h3{font-size:16px; margin-bottom:8px; font-weight:700;}
.step-card p{font-size:13px; color:var(--muted);}

.footer-note{text-align:center; font-size:12px; color:var(--muted2); padding:26px 0 50px; border-top:1px solid var(--line); margin-top:20px;}
.footer-note b{color:var(--red);}

/* ===== Generic page ===== */
.page{padding:50px 0 80px;}
.page-head{margin-bottom:36px;}
.page-head h2{font-size:32px; font-weight:900;}
.page-head p{color:var(--muted); margin-top:8px; font-size:14px;}

/* ===== Game layout ===== */
.game-grid{display:grid; grid-template-columns:260px 1fr 300px; gap:24px; align-items:start;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px;}
.panel h3{font-size:12px; letter-spacing:1.5px; color:var(--muted); margin-bottom:16px; text-transform:uppercase; font-weight:700;}
.round-badge{font-family:var(--font-display); font-weight:900; font-size:30px; color:var(--red); margin-bottom:4px;}
.round-sub{font-size:12px; color:var(--muted2); margin-bottom:20px;}
.score-row{display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line);}
.score-row:first-of-type{border-top:none;}
.score-name{font-size:13px; color:var(--muted);}
.score-val{font-family:var(--font-display); font-weight:900; font-size:18px;}
.score-val.pos{color:#5dd08a;}
.score-val.neg{color:var(--red-glow);}

.qbar-row{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12px;}
.qbar-icon{width:20px; text-align:center; font-size:14px;}
.qbar-track{flex:1; height:8px; background:#241f1d; border-radius:4px; overflow:hidden; position:relative;}
.qbar-fill{height:100%; background:linear-gradient(90deg,var(--red2),var(--red)); transition:width .5s;}
.qbar-val{width:36px; text-align:right; color:var(--muted2); font-size:11px;}

.hint-line{font-size:12px; color:var(--muted); padding:8px 0; border-top:1px solid var(--line);}
.hint-line:first-of-type{border-top:none;}
.hint-tip{background:rgba(217,164,65,.08); border:1px solid rgba(217,164,65,.3); color:var(--gold); font-size:12px; padding:10px 12px; border-radius:8px; margin-top:14px;}
.freq-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-top:6px;}
.freq-cell{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px;}
.freq-bar-wrap{width:100%; height:40px; background:#241f1d; border-radius:3px; display:flex; align-items:flex-end;}
.freq-bar{width:100%; background:var(--red); border-radius:3px 3px 0 0; min-height:2px;}
.freq-n{font-size:10px; color:var(--muted2);}

.center-col{display:flex; flex-direction:column; align-items:center; gap:22px;}
.bet-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:10px; width:100%;}
.bet-btn{
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 4px;
  display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted);
}
.bet-btn .ic{font-size:17px;}
.bet-btn .nm{font-size:10px; font-weight:500;}
.bet-btn .rw{font-size:10px; color:var(--muted2);}
.bet-btn:hover{border-color:var(--muted);}
.bet-btn.selected{border-color:var(--red); background:rgba(184,31,42,.14); color:var(--text); box-shadow:0 0 0 1px var(--red);}
.bet-btn:disabled{opacity:.4;}

.result-banner{width:100%; border-radius:12px; padding:20px 24px; border:1px solid var(--line); background:var(--panel);}
.result-cols{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:12px;}
.result-side{border-radius:10px; padding:14px; background:#120f0e; border:1px solid var(--line);}
.result-side.win{border-color:#2f6b46;}
.result-side.lose{border-color:var(--red2);}
.result-tag{font-size:11px; color:var(--muted2); margin-bottom:6px; font-weight:600;}
.result-icon{font-size:20px;}
.result-reward{font-family:var(--font-display); font-weight:900; font-size:20px; margin-top:6px;}

.progress-dots{display:flex; gap:8px; margin:6px 0 18px;}
.dot{width:10px; height:10px; border-radius:50%; background:#2b2422;}
.dot.done{background:var(--red);}
.dot.now{background:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,.25);}

/* survey */
.survey-card{max-width:560px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:34px;}
.survey-q{margin-bottom:22px;}
.survey-q label{font-size:14px; color:var(--muted); display:block; margin-bottom:10px; font-weight:500;}
.scale{display:flex; gap:8px;}
.scale button{flex:1; padding:10px 0; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:13px; font-weight:500;}
.scale button.on{border-color:var(--red); background:rgba(184,31,42,.15); color:var(--text);}

/* results / history */
.compare-bars{display:flex; align-items:flex-end; gap:40px; height:220px; margin:30px 0;}
.compare-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.compare-fill{width:70px; border-radius:8px 8px 0 0; transition:height .6s;}
.compare-fill.human{background:linear-gradient(180deg,var(--gold),#a97b26);}
.compare-fill.ai{background:linear-gradient(180deg,var(--red),var(--red2));}
.compare-label{margin-top:10px; font-size:13px; color:var(--muted); font-weight:500;}
.compare-score{font-family:var(--font-display); font-weight:900; font-size:22px; margin-top:4px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
th{color:var(--muted2); font-weight:700; font-size:11px; letter-spacing:.5px; text-transform:uppercase;}
tr:hover td{background:rgba(255,255,255,.02);}
.tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
.tag.win{background:rgba(93,208,138,.15); color:#5dd08a;}
.tag.lose{background:rgba(230,57,70,.15); color:var(--red-glow);}

.empty{text-align:center; color:var(--muted2); padding:60px 0; font-size:14px;}

/* data page */
.data-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:34px;}
.data-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px;}
.data-card .lbl{font-size:12px; color:var(--muted2); margin-bottom:8px; font-weight:500;}
.data-card .val{font-family:var(--font-display); font-weight:900; font-size:26px; color:var(--red);}
.notice{background:rgba(217,164,65,.08); border:1px solid rgba(217,164,65,.3); color:var(--gold); font-size:13px; padding:12px 16px; border-radius:8px; margin-bottom:26px; font-weight:500;}
.data-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.table-scroll{max-height:520px; overflow:auto; border:1px solid var(--line); border-radius:10px;}
.table-scroll table{font-size:12px;}
.table-scroll thead th{position:sticky; top:0; background:#1c1815; z-index:1;}
.winner-badge{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700;}
.winner-badge.human{background:rgba(217,164,65,.15); color:var(--gold);}
.winner-badge.ai{background:rgba(184,31,42,.18); color:var(--red-glow);}
.winner-badge.tie{background:#2b2422; color:var(--muted);}
.rank-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.rank-row{display:grid; grid-template-columns:42px 1fr 80px 76px; gap:10px; align-items:center; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:#120f0e; font-size:12px;}
.rank-pos{font-family:var(--font-display); font-weight:900; color:var(--gold); font-size:16px;}
.ai-log{margin-top:12px; max-height:150px; overflow:auto; border-top:1px solid var(--line);}
.ai-log-row{padding:8px 0; border-bottom:1px solid var(--line); font-size:11px; color:var(--muted);}
.save-status{font-size:12px; text-align:center; margin-top:10px; color:var(--muted);}
.save-status.ok{color:#5dd08a}.save-status.fail{color:var(--red-glow);}

/* faq / about */
.faq-item{border-bottom:1px solid var(--line); padding:20px 0;}
.faq-item h3{font-size:15px; margin-bottom:8px; color:var(--text); font-weight:700;}
.faq-item p{font-size:13px; color:var(--muted);}
.about-block{max-width:760px; margin-bottom:30px;}
.about-block h3{font-size:18px; margin-bottom:10px; color:var(--red); font-weight:700; font-family:var(--font-display);}
.about-block p{font-size:14px; color:var(--muted); line-height:1.85;}


.id-editor{display:flex;align-items:center;gap:7px}.id-input,.pattern-input{background:#100e0d;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font-family:inherit}.id-input{width:135px;font-size:12px}.id-input:focus,.pattern-input:focus{outline:none;border-color:var(--red)}.id-save{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px}.id-save:hover{color:var(--text);border-color:var(--red)}
.pattern-box{margin:22px 0;padding:18px;border:1px solid rgba(217,164,65,.3);background:rgba(217,164,65,.06);border-radius:10px}.pattern-box label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.pattern-box p{font-size:12px;color:var(--muted);margin-bottom:10px}.pattern-input{width:100%;min-height:92px;resize:vertical;font-size:13px}
.result-ranking{margin-top:24px}.rank-me{border:1px solid rgba(217,164,65,.45);background:rgba(217,164,65,.08);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-weight:700}.rank-list{display:flex;flex-direction:column}.rank-row{display:grid;grid-template-columns:50px 1fr 90px 100px;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px}.rank-pos{font-family:var(--font-display);font-size:18px;color:var(--gold);font-weight:900}.rank-row.current{background:rgba(184,31,42,.10)}
.save-status{margin:18px 0 0;padding:12px 15px;border-radius:8px;text-align:center;font-size:13px}.save-status.ok{color:#5dd08a;border:1px solid rgba(93,208,138,.35);background:rgba(93,208,138,.08)}.save-status.fail{color:var(--red-glow);border:1px solid rgba(230,57,70,.4);background:rgba(230,57,70,.08)}

/* ===== School login ===== */
.login-shell{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:50px 20px;}
.login-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.45);}
.login-card h2{font-size:28px;margin-bottom:8px;}
.login-card p{font-size:14px;color:var(--muted);margin-bottom:24px;}
.login-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.login-input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:9px;background:#100e0d;color:var(--text);font:inherit;outline:none;}
.login-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(184,31,42,.14);}
.login-error{min-height:22px;color:var(--red-glow);font-size:12px;margin-top:8px;}
.login-domain{margin-top:16px;padding:11px 12px;border-radius:8px;background:rgba(217,164,65,.08);border:1px solid rgba(217,164,65,.25);font-size:12px;color:var(--gold);}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:7px 9px 7px 13px;border-radius:22px;font-size:11px;color:var(--muted);}
.user-chip b{color:var(--gold);font-size:12px;}
.logout-btn{border:0;background:#2b2422;color:var(--muted);border-radius:15px;padding:5px 9px;font-size:10px;}
.logout-btn:hover{color:var(--text);}

@media(max-width:1000px){
  .hero{grid-template-columns:1fr;}
  .game-grid{grid-template-columns:1fr;}
  .steps{grid-template-columns:repeat(2,1fr);}
  .data-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<script type="module">

  getFirestore, collection, doc, setDoc, getDocs,
  query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCggtRdCkNunW22_qXdpJuC3hDZQCfsNxE",
  authDomain: "rp-1-cca59.firebaseapp.com",
  projectId: "rp-1-cca59",
  storageBucket: "rp-1-cca59.firebasestorage.app",
  messagingSenderId: "855700821145",
  appId: "1:855700821145:web:e0a6da84dc378047621408",

};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// Analytics는 일부 브라우저·로컬 파일 환경에서 지원되지 않을 수 있으므로 선택적으로 시작한다.

  if (ok) getAnalytics(firebaseApp);
}).catch(err => console.warn("Analytics 초기화 생략", err));

const SESSION_COLLECTION = "gameResults";

/* ============================================================
   NeuroRoulette — 연구용 룰렛 · Q-learning 비교 데모
   로그인 없이 익명 참가자 ID로 동작하며, 모든 실험 데이터는
   Firebase Firestore에 누적되어 연구자가 전체 데이터를
   "데이터 & 결과" 페이지에서 확인 · 다운로드할 수 있습니다.
   ============================================================ */

/* ---------- 세그먼트 정의 ---------- */
const SEGMENTS = [
  {icon:'🙂', name:'스마일', reward:10},
  {icon:'🧠', name:'브레인', reward:50},
  {icon:'❤️', name:'하트',   reward:15},
  {icon:'🎁', name:'선물',   reward:25},
  {icon:'💀', name:'해골',   reward:-30},
  {icon:'🎀', name:'리본',   reward:20},
  {icon:'❓', name:'미스터리', reward:15},
  {icon:'⭐', name:'스타',   reward:30},
];
const N = SEGMENTS.length;
const SLICE = 360 / N;
const MAX_ROUNDS = 7;
/* 라운드마다 "핫 세그먼트"가 이동하는 규칙 (패턴) */
const HOT_PATTERN = [0,2,4,6,1,3,5];
const HOT_PROB = 0.40;

function hotSegmentForRound(round){ return HOT_PATTERN[(round-1) % HOT_PATTERN.length]; }
function probsForRound(round){
  const hot = hotSegmentForRound(round);
  const rest = (1 - HOT_PROB) / (N - 1);
  return SEGMENTS.map((_,i)=> i===hot ? HOT_PROB : rest);
}
function weightedPick(probs){
  let r = Math.random(), cum = 0;
  for(let i=0;i<probs.length;i++){ cum += probs[i]; if(r <= cum) return i; }
  return probs.length - 1;
}
function rewardFor(matched, idx){ return matched ? SEGMENTS[idx].reward : -5; }

/* ---------- Q-learning 에이전트 ---------- */
let Q = new Array(N).fill(0);
let epsilon = 0.5;
const ALPHA = 0.5;
function aiChoose(){
  if(Math.random() < epsilon) return Math.floor(Math.random()*N);
  let best = 0;
  for(let i=1;i<N;i++) if(Q[i] > Q[best]) best = i;
  return best;
}
function aiLearn(action, reward){ Q[action] += ALPHA * (reward - Q[action]); }

const state = {
  view:'home',
  participantId:null,
  authenticated:false,
  userEmail:'',
  loginError:'',
  round:1,
  selected:null,
  spinning:false,
  wheelRotation:0,
  humanScore:0,
  aiScore:0,
  roundHistory:[],
  landingHistory:[],
  roundResult:null,
  aiActionThisRound:null,
  survey:{difficulty:null, confidence:null, enjoy:null, patternGuess:''},
  allSessions:[],
  loadingSessions:false,
  saveStatus:'',
  aiLearningLog:[],
  lastSavedSessionId:null,
  saving:false,
};

/* ---------- Firestore helpers ---------- */
const DOWNLOAD_PASSWORD = 'NEURO2026'; // 주의: 프런트엔드 암호는 완전한 보안 수단이 아닙니다.
const SCHOOL_DOMAIN = 'hanmin.hs.kr';

function normalizeFirestoreSession(documentSnapshot){
  const data = documentSnapshot.data();
  return {
    id: documentSnapshot.id,
    ...data,
    // Firestore Timestamp가 있으면 화면·CSV에서 쓰기 쉬운 ISO 문자열로 변환한다.
    date: data.createdAt?.toDate
      ? data.createdAt.toDate().toISOString()
      : (data.date || new Date(0).toISOString())
  };
}

function escapeHTML(value){
  return String(value??'').replace(/[&<>'"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function makeRandomNickname(){
  const a=['빛나는','침착한','호기심많은','빠른','영리한','대담한','차분한','집중하는','기민한','귀여운'];
  const b=['뉴런','시냅스','도파민','알파파','탐험가','연구자','브레인','룰렛','별빛','원숭이'];
  const num=Math.floor(100+Math.random()*900);
  return `${a[Math.floor(Math.random()*a.length)]}${b[Math.floor(Math.random()*b.length)]}${num}`;
}
function ensureParticipant(){
  // 페이지에 새로 접속하거나 새로고침할 때마다 새로운 익명 닉네임을 만든다.
  state.participantId = makeRandomNickname();
}
function validSchoolEmail(value){
  const email=String(value||'').trim().toLowerCase();
  return /^[^\s@]+@hanmin\.hs\.kr$/.test(email) ? email : '';
}
function maskEmail(email){
  const [name,domain]=String(email).split('@');
  if(!name||!domain) return '';
  return `${name.slice(0,2)}${'*'.repeat(Math.max(2,name.length-2))}@${domain}`;
}
function login(){
  const input=document.getElementById('school-email');
  const email=validSchoolEmail(input ? input.value : '');
  if(!email){
    state.loginError='@hanmin.hs.kr로 끝나는 학교 이메일을 정확히 입력하세요.';
    render();
    setTimeout(()=>document.getElementById('school-email')?.focus(),0);
    return;
  }
  state.authenticated=true;
  state.userEmail=email;
  state.loginError='';
  try{ sessionStorage.setItem('nr_school_email',email); }catch(e){}
  state.view='home';
  render();
}
function logout(){
  state.authenticated=false;
  state.userEmail='';
  state.loginError='';
  try{ sessionStorage.removeItem('nr_school_email'); }catch(e){}
  state.view='home';
  ensureParticipant();
  render();
}

async function loadAllSessions(){
  state.loadingSessions = true;
  try{
    const sessionsQuery = query(
      collection(db, SESSION_COLLECTION),
      orderBy('createdAt', 'desc')
    );
    const snapshot = await getDocs(sessionsQuery);
    state.allSessions = snapshot.docs.map(normalizeFirestoreSession);
  }catch(e){
    console.error('Firestore 데이터 불러오기 실패', e);
    state.allSessions = [];
    state.saveStatus = '전체 기록을 불러오지 못했습니다. Firestore 규칙과 인터넷 연결을 확인하세요.';
  }finally{
    state.loadingSessions = false;
  }
}

async function appendSession(session){
  try{
    const sessionRef = doc(db, SESSION_COLLECTION, session.id);
    await setDoc(sessionRef, {
      ...session,
      createdAt: serverTimestamp()
    });

    state.lastSavedSessionId = session.id;
    state.saveStatus = '게임 결과가 Firebase Firestore에 정상 저장되었습니다. 1등과 2등은 보상을 받을 수 있습니다! 로그아웃 시 익명 닉네임이 바뀔 가능성이 있습니다. 점수가 충분하다면 증명을 위해 화면을 캡쳐해두세요.';
    return true;
  }catch(e){
    console.error('Firestore 데이터 저장 실패', e);
    state.saveStatus = '저장에 실패했습니다. Firestore 생성 여부와 보안 규칙을 확인하세요.';
    return false;
  }
}

function requireDownloadPassword(){
  const entered = prompt('전체 데이터셋 다운로드 암호를 입력하세요.');
  if(entered === null) return false;
  if(entered !== DOWNLOAD_PASSWORD){ alert('암호가 올바르지 않습니다.'); return false; }
  return true;
}

/* ---------- 데이터 내보내기 ---------- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportJSON(){
  if(!requireDownloadPassword()) return;
  const blob = new Blob([JSON.stringify(state.allSessions, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'neuroroulette_dataset.json');
}
function exportCSV(){
  if(!requireDownloadPassword()) return;
  const rows = [['participant_id','user_email','session_date','human_score','ai_score','winner','round','hot_segment','landing_segment','human_choice','human_matched','human_reward','ai_choice','ai_matched','ai_reward']];
  state.allSessions.forEach(s=>{
    s.rounds.forEach(r=>{
      rows.push([
        s.participantId, s.userEmail || '', s.date, s.humanScore, s.aiScore, s.winner,
        r.round, hotSegmentForRound(r.round), r.landing,
        r.humanChoice, r.humanMatched, r.humanReward,
        r.aiChoice, r.aiMatched, r.aiReward
      ]);
    });
  });
  const csv = rows.map(row=>row.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  downloadBlob(blob, 'neuroroulette_dataset.csv');
}

/* ---------- 게임 로직 ---------- */
function resetGame(){
  Q = new Array(N).fill(0);
  epsilon = 0.5;
  state.round = 1;
  state.selected = null;
  state.spinning = false;
  state.humanScore = 0;
  state.aiScore = 0;
  state.roundHistory = [];
  state.landingHistory = [];
  state.roundResult = null;
  state.survey = {difficulty:null, confidence:null, enjoy:null, patternGuess:''};
  state.saveStatus = '';
  state.aiLearningLog = [];
  state.lastSavedSessionId = null;
  state.saving = false;
}
function startGame(){
  if(!state.authenticated){ state.view='login'; render(); return; }
  resetGame();
  state.view = 'game';
  render();
}
function selectSegment(i){
  if(state.spinning || state.roundResult) return;
  state.selected = i;
  render();
}
function spin(){
  if(state.selected===null || state.spinning || state.roundResult) return;

  const round = state.round;
  const probs = probsForRound(round);
  const landing = weightedPick(probs);
  const aiAction = aiChoose();
  state.aiActionThisRound = aiAction;

  const fromRotation = state.wheelRotation;
  const targetCenter = landing*SLICE + SLICE/2;
  const currentMod = ((fromRotation % 360)+360)%360;
  const desiredMod = ((-targetCenter % 360)+360)%360;
  let delta = desiredMod - currentMod;
  if(delta <= 0) delta += 360;

  // 최소 7바퀴를 돌고 정확히 당첨 칸의 중앙에서 멈춘다.
  const toRotation = fromRotation + 7*360 + delta;
  state.wheelRotation = toRotation;
  state.spinning = true;
  render();

  // innerHTML 재렌더링 때문에 CSS transition이 시작점을 잃는 문제를
  // Web Animations API로 해결한다.
  requestAnimationFrame(()=>{
    const wheel = document.querySelector('.center-col .wheel-face');
    if(!wheel){ resolveRound(landing, aiAction, round); return; }

    const animation = wheel.animate([
      {transform:`rotate(${fromRotation}deg)`, filter:'blur(0px)', offset:0},
      {transform:`rotate(${fromRotation + 120}deg)`, filter:'blur(.25px)', offset:.10},
      {transform:`rotate(${toRotation - 150}deg)`, filter:'blur(.55px)', offset:.72},
      {transform:`rotate(${toRotation - 18}deg)`, filter:'blur(0px)', offset:.93},
      {transform:`rotate(${toRotation + 4}deg)`, filter:'blur(0px)', offset:.975},
      {transform:`rotate(${toRotation}deg)`, filter:'blur(0px)', offset:1}
    ], {
      duration:3900,
      easing:'cubic-bezier(.12,.68,.10,1)',
      fill:'forwards'
    });

    animation.finished
      .then(()=>resolveRound(landing, aiAction, round))
      .catch(()=>resolveRound(landing, aiAction, round));
  });
}
function resolveRound(landing, aiAction, round){
  const humanMatched = state.selected === landing;
  const aiMatched = aiAction === landing;
  const humanReward = rewardFor(humanMatched, landing);
  const aiReward = rewardFor(aiMatched, landing);
  const oldQ = Q[aiAction];
  aiLearn(aiAction, aiReward);
  const newQ = Q[aiAction];
  const oldEpsilon = epsilon;
  epsilon *= 0.75;
  state.aiLearningLog.unshift({round, action:aiAction, reward:aiReward, oldQ, newQ, epsilonBefore:oldEpsilon, epsilonAfter:epsilon});

  state.humanScore += humanReward;
  state.aiScore += aiReward;
  state.roundHistory.push({round, landing, humanChoice:state.selected, aiChoice:aiAction, humanReward, aiReward, humanMatched, aiMatched});
  state.landingHistory.push(landing);
  state.spinning = false;
  state.roundResult = {landing, humanMatched, aiMatched, humanReward, aiReward};
  render();
}
function nextRound(){
  if(state.round >= MAX_ROUNDS){
    state.view = 'survey';
    render();
    return;
  }
  state.round += 1;
  state.selected = null;
  state.roundResult = null;
  render();
}
async function finishAndSave(){
  if(state.saving) return;
  state.saving = true;
  state.saveStatus = '결과를 저장하고 확인하는 중입니다…';
  render();
  const winner = state.humanScore > state.aiScore ? 'human' : (state.aiScore > state.humanScore ? 'ai' : 'tie');
  const session = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
    participantId: state.participantId,
    userEmail: state.userEmail,
    schoolDomain: SCHOOL_DOMAIN,
    date: new Date().toISOString(),
    humanScore: state.humanScore,
    aiScore: state.aiScore,
    winner,
    rounds: state.roundHistory,
    survey: {...state.survey, patternGuess:String(state.survey.patternGuess||'').trim()},
    finalQ: [...Q],
    finalEpsilon: epsilon,
    aiLearningLog: [...state.aiLearningLog],
  };
  const saved = await appendSession(session);
  state.saving = false;
  if(saved){
    await loadAllSessions();
    state.view = 'results';
  }else{
    state.view = 'survey';
  }
  render();
}

/* ---------- 네비게이션 ---------- */
function goto(view){
  if(!state.authenticated){ state.view='login'; render(); return; }
  state.view = view;
  if(view==='data') loadAllSessions().then(render);
  render();
}

function iconWheelSlices(rotation){
  let bg = 'conic-gradient(from 0deg,';
  const parts = [];
  for(let i=0;i<N;i++){
    const c = i%2===0 ? '#8a1a22' : '#141110';
    parts.push(`${c} ${i*SLICE}deg ${(i+1)*SLICE}deg`);
  }
  bg += parts.join(',') + ')';
  let icons = '';
  for(let i=0;i<N;i++){
    const angle = i*SLICE + SLICE/2;
    icons += `<div class="wheel-slice-icon" style="transform:translate(-50%,-50%) rotate(${angle}deg) translateY(-118px) rotate(${-angle}deg);">${SEGMENTS[i].icon}</div>`;
  }
  return `<div class="wheel-face" style="background:${bg}; transform:rotate(${rotation}deg);">${icons}</div>`;
}

function renderGame(){
  const round = state.round;
  const dots = Array.from({length:MAX_ROUNDS}, (_,i)=>{
    const n = i+1;
    let cls = 'dot';
    if(n < round) cls += ' done'; else if(n===round) cls += ' now';
    return `<div class="${cls}"></div>`;
  }).join('');

  const freqCounts = new Array(N).fill(0);
  state.landingHistory.forEach(i=> freqCounts[i]++);
  const maxFreq = Math.max(1, ...freqCounts);
  const freqHTML = SEGMENTS.map((s,i)=>`
    <div class="freq-cell">
      <div class="freq-bar-wrap"><div class="freq-bar" style="height:${(freqCounts[i]/maxFreq*100)||2}%"></div></div>
      <div>${s.icon}</div>
      <div class="freq-n">${freqCounts[i]}</div>
    </div>`).join('');

  const recentLanding = state.landingHistory.slice(-3).reverse().map(i=>SEGMENTS[i].icon).join(' ') || '—';

  const qMax = Math.max(0.001, ...Q.map(v=>Math.abs(v)));
  const aiLogHTML = state.aiLearningLog.length ? state.aiLearningLog.slice(0,5).map(log=>`<div class="ai-log-row"><b>${log.round}R</b> ${SEGMENTS[log.action].icon} 선택 · 보상 ${log.reward>0?'+':''}${log.reward} · Q ${log.oldQ.toFixed(1)} → <b>${log.newQ.toFixed(1)}</b> · ε ${log.epsilonAfter.toFixed(2)}</div>`).join('') : '<div class="ai-log-row">아직 학습 기록이 없습니다.</div>';

  const qHTML = SEGMENTS.map((s,i)=>{
    const pct = Math.max(2, (Math.max(0,Q[i]) / (qMax||1)) * 100);
    return `<div class="qbar-row">
      <div class="qbar-icon">${s.icon}</div>
      <div class="qbar-track"><div class="qbar-fill" style="width:${pct}%"></div></div>
      <div class="qbar-val">${Q[i].toFixed(1)}</div>
    </div>`;
  }).join('');

  const betHTML = SEGMENTS.map((s,i)=>{
    const disabled = state.spinning || state.roundResult;
    return `<button class="bet-btn ${state.selected===i?'selected':''}" ${disabled?'disabled':''} data-action="select-seg" data-idx="${i}">
      <div class="ic">${s.icon}</div><div class="nm">${s.name}</div><div class="rw">${s.reward>0?'+':''}${s.reward}</div>
    </button>`;
  }).join('');

  let resultHTML = '';
  if(state.roundResult){
    const r = state.roundResult;
    resultHTML = `
    <div class="result-banner">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><b>${round}라운드 결과</b> — 당첨 세그먼트: ${SEGMENTS[r.landing].icon} ${SEGMENTS[r.landing].name}</div>
        <button class="btn-primary" data-action="next-round">${round>=MAX_ROUNDS?'결과 보기':'다음 라운드'} →</button>
      </div>
      <div class="result-cols">
        <div class="result-side ${r.humanMatched?'win':'lose'}">
          <div class="result-tag">🙋 당신의 선택</div>
          <div class="result-icon">${SEGMENTS[state.roundHistory[state.roundHistory.length-1].humanChoice].icon}</div>
          <div>${r.humanMatched? '적중! 🎉' : '빗나감'}</div>
          <div class="result-reward" style="color:${r.humanReward>=0?'#5dd08a':'#e63946'}">${r.humanReward>0?'+':''}${r.humanReward}점</div>
        </div>
        <div class="result-side ${r.aiMatched?'win':'lose'}">
          <div class="result-tag">🤖 AI의 선택</div>
          <div class="result-icon">${SEGMENTS[state.aiActionThisRound].icon}</div>
          <div>${r.aiMatched? '적중! 🎉' : '빗나감'}</div>
          <div class="result-reward" style="color:${r.aiReward>=0?'#5dd08a':'#e63946'}">${r.aiReward>0?'+':''}${r.aiReward}점</div>
        </div>
      </div>
    </div>`;
  }

  const showHint = round >= 3;

  return `
  <div class="wrap page">
    <div class="progress-dots">${dots}</div>
    <div class="game-grid">
      <div class="panel">
        <h3>진행 상황</h3>
        <div class="round-badge">${round} / ${MAX_ROUNDS}</div>
        <div class="round-sub">현재 라운드</div>
        <div class="score-row"><div class="score-name">🙋 내 점수</div><div class="score-val ${state.humanScore>=0?'pos':'neg'}">${state.humanScore}</div></div>
        <div class="score-row"><div class="score-name">🤖 AI 점수</div><div class="score-val ${state.aiScore>=0?'pos':'neg'}">${state.aiScore}</div></div>
        <h3 style="margin-top:24px;">AI 두뇌 상태 (Q값)</h3>
        ${qHTML}
        <div class="hint-line">ε: ${epsilon.toFixed(2)} · 학습률 α: ${ALPHA}</div>
        <div class="ai-log">${aiLogHTML}</div>
      </div>

      <div class="center-col">
        <div class="wheel-outer ${state.spinning?'spinning':''}" style="width:340px; height:340px;">
          <div class="wheel-pointer">▼</div>
          <div class="wheel-ring"></div>
          ${iconWheelSlices(state.wheelRotation)}
          <button class="wheel-hub clickable" data-action="spin" ${(state.selected===null||state.spinning||state.roundResult)?'disabled':''}>${state.spinning?'...':'SPIN'}</button>
        </div>
        <div class="bet-grid">${betHTML}</div>
        ${resultHTML}
      </div>

      <div class="panel">
        <h3>패턴 힌트 💡</h3>
        <div class="hint-line">최근 당첨 세그먼트: <b>${recentLanding}</b></div>
        <div class="hint-line">누적 당첨 빈도 (관측치)</div>
        <div class="freq-grid">${freqHTML}</div>
        ${showHint ? `<div class="hint-tip">💡 힌트: 당첨 세그먼트가 라운드마다 일정한 규칙으로 이동하는 것 같지 않나요? 최근 결과를 살펴보세요.</div>` : `<div class="hint-tip" style="opacity:.6;">3라운드 이후부터 패턴 힌트가 표시됩니다.</div>`}
      </div>
    </div>
  </div>`;
}

function renderSurvey(){
  const q = (key, label, opts) => `
    <div class="survey-q">
      <label>${label}</label>
      <div class="scale">
        ${opts.map((o,i)=>`<button class="${state.survey[key]===i?'on':''}" data-action="survey-pick" data-key="${key}" data-val="${i}">${o}</button>`).join('')}
      </div>
    </div>`;
  const allAnswered = state.survey.difficulty!==null && state.survey.confidence!==null && state.survey.enjoy!==null;
  return `
  <div class="wrap page">
    <div class="page-head" style="text-align:center;">
      <h2>짧은 설문조사</h2>
      <p>게임 참여 후 간단한 설문으로 당신의 생각을 들려주세요.</p>
    </div>
    <div class="survey-card">
      ${q('difficulty','패턴을 파악하는 것이 얼마나 어려웠나요?', ['매우 쉬움','쉬움','보통','어려움','매우 어려움'])}
      ${q('confidence','자신의 선택에 얼마나 확신이 있었나요?', ['전혀 없음','조금','보통','높음','매우 높음'])}
      ${q('enjoy','게임이 얼마나 흥미로웠나요?', ['전혀','조금','보통','흥미로움','매우 흥미로움'])}
      <div class="pattern-box">
        <label for="pattern-guess">🔍 이 룰렛의 당첨 확률 규칙은 무엇이었다고 생각하나요?</label>
        <p>정답을 몰라도 괜찮습니다. 라운드별로 어떤 칸의 확률이 어떻게 변했다고 추측했는지 적어주세요.</p>
        <textarea id="pattern-guess" class="pattern-input" data-action="pattern-input" placeholder="예: 확률이 높은 칸이 매 라운드 두 칸씩 이동한 것 같다.">${escapeHTML(state.survey.patternGuess || '')}</textarea>
      </div>
      <button class="btn-primary" style="width:100%; justify-content:center; margin-top:10px;" data-action="finish-save" ${allAnswered?'':'disabled'}>결과 보기 →</button>
      <div style="text-align:center; margin-top:10px;"><a href="#" data-action="finish-save" style="font-size:12px; color:var(--muted2);">설문 건너뛰기</a></div>
    </div>
  </div>`;
}

function renderResults(){
  const max = Math.max(20, Math.abs(state.humanScore), Math.abs(state.aiScore));
  const hH = Math.max(6, Math.abs(state.humanScore)/max*180);
  const aH = Math.max(6, Math.abs(state.aiScore)/max*180);
  const winner = state.humanScore > state.aiScore ? 'human' : (state.aiScore > state.humanScore ? 'ai' : 'tie');
  const winnerText = winner==='human' ? '🎉 당신이 AI를 이겼습니다!' : winner==='ai' ? '🤖 이번엔 AI가 더 나은 결정을 내렸습니다.' : '🤝 무승부입니다!';
  const ranking = [...(state.allSessions||[])].sort((a,b)=>b.humanScore-a.humanScore || new Date(a.date)-new Date(b.date));
  const myIndex = ranking.findIndex(s=>s.id===state.lastSavedSessionId);
  const resultRankHTML = ranking.slice(0,10).map((s,i)=>`<div class="rank-row ${s.id===state.lastSavedSessionId?'current':''}"><div class="rank-pos">${i+1}</div><div><b>${escapeHTML(s.participantId)}</b></div><div>${s.humanScore}점</div><div>${s.winner==='human'?'인간 승':s.winner==='ai'?'AI 승':'무승부'}</div></div>`).join('');

  const rowsHTML = state.roundHistory.map(r=>`
    <tr>
      <td>${r.round}</td>
      <td>${SEGMENTS[r.landing].icon} ${SEGMENTS[r.landing].name}</td>
      <td>${SEGMENTS[r.humanChoice].icon} <span class="tag ${r.humanMatched?'win':'lose'}">${r.humanMatched?'적중':'빗나감'}</span></td>
      <td>${r.humanReward>0?'+':''}${r.humanReward}</td>
      <td>${SEGMENTS[r.aiChoice].icon} <span class="tag ${r.aiMatched?'win':'lose'}">${r.aiMatched?'적중':'빗나감'}</span></td>
      <td>${r.aiReward>0?'+':''}${r.aiReward}</td>
    </tr>`).join('');

  return `
  <div class="wrap page">
    <div class="page-head" style="text-align:center;">
      <h2>최종 결과</h2>
      <p>${winnerText} · 참가자 ID: ${state.participantId}</p>
    </div>
    <div class="compare-bars">
      <div class="compare-col">
        <div class="compare-fill human" style="height:${hH}px"></div>
        <div class="compare-label">🙋 나</div>
        <div class="compare-score" style="color:var(--gold)">${state.humanScore}점</div>
      </div>
      <div class="compare-col">
        <div class="compare-fill ai" style="height:${aH}px"></div>
        <div class="compare-label">🤖 Q-learning AI</div>
        <div class="compare-score" style="color:var(--red-glow)">${state.aiScore}점</div>
      </div>
    </div>
    <div class="panel">
      <h3>라운드별 상세 기록</h3>
      <table>
        <thead><tr><th>라운드</th><th>당첨</th><th>내 선택</th><th>내 점수</th><th>AI 선택</th><th>AI 점수</th></tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>
    <div class="panel result-ranking">
      <h3>게임 종료 순위</h3>
      <div class="rank-me">${myIndex>=0 ? `현재 기록은 전체 ${ranking.length}개 세션 중 <span style="color:var(--gold)">${myIndex+1}위</span>입니다.` : '현재 순위를 계산하지 못했습니다.'}</div>
      ${resultRankHTML ? `<div class="rank-list">${resultRankHTML}</div>` : `<div class="empty">저장된 순위가 없습니다.</div>`}
    </div>
    <div class="save-status ${state.saveStatus.includes('실패')?'fail':'ok'}">${state.saveStatus}</div>
    <div style="display:flex; gap:14px; justify-content:center; margin-top:30px;">
      <button class="btn-primary" data-action="start-game">🔁 다시 도전하기</button>
      <button class="btn-secondary" data-action="goto" data-view="data">📊 전체 데이터 보기</button>
    </div>
  </div>`;
}

function renderData(){
  const sessions = state.allSessions || [];
  if(state.loadingSessions){
    return `<div class="wrap page"><div class="page-head"><h2>데이터 & 결과</h2></div><div class="empty">전체 실험 데이터를 불러오는 중…</div></div>`;
  }
  const totalSessions = sessions.length;
  const participants = new Set(sessions.map(s=>s.participantId)).size;
  const totalRounds = sessions.reduce((a,s)=>a+s.rounds.length,0);
  const humanWins = sessions.filter(s=>s.winner==='human').length;
  const aiWins = sessions.filter(s=>s.winner==='ai').length;
  const ties = sessions.filter(s=>s.winner==='tie').length;
  const total = Math.max(1, humanWins+aiWins+ties);

  const ranking = [...sessions].sort((a,b)=>b.humanScore-a.humanScore || new Date(a.date)-new Date(b.date));
  const rankHTML = ranking.slice(0,20).map((s,i)=>`<div class="rank-row"><div class="rank-pos">${i+1}</div><div><b>${escapeHTML(s.participantId)}</b><br><span style="color:var(--muted2)">${new Date(s.date).toLocaleDateString('ko-KR')}</span></div><div>${s.humanScore}점</div><div>${s.winner==='human'?'인간 승':s.winner==='ai'?'AI 승':'무승부'}</div></div>`).join('');

  const rowsHTML = sessions.map(s=>{
    const badgeCls = s.winner==='human'?'human':(s.winner==='ai'?'ai':'tie');
    const badgeText = s.winner==='human'?'인간 승':(s.winner==='ai'?'AI 승':'무승부');
    const d = new Date(s.date);
    return `<tr>
      <td>${escapeHTML(s.participantId)}</td>
      <td>${d.toLocaleDateString('ko-KR')} ${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</td>
      <td>${s.humanScore}</td>
      <td>${s.aiScore}</td>
      <td>${s.rounds.length}</td>
      <td><span class="winner-badge ${badgeCls}">${badgeText}</span></td>
    </tr>`;
  }).join('');

  return `<div class="wrap page">
    <div class="page-head"><h2>데이터 & 결과</h2><p>이 사이트를 통해 수집된 <b>전체 실험 데이터셋</b>입니다 — 참가자 전체의 세션이 누적되어 표시됩니다.</p></div>
    <div class="notice">ℹ️ 세션 목록과 순위는 열람할 수 있지만, 전체 JSON/CSV 다운로드에는 관리자 암호가 필요합니다. 모든 기기의 기록은 Firebase Firestore의 동일한 데이터베이스에 누적됩니다.</div>
    <div class="data-grid">
      <div class="data-card"><div class="lbl">누적 참가자</div><div class="val">${participants.toLocaleString()}</div></div>
      <div class="data-card"><div class="lbl">완료된 세션</div><div class="val">${totalSessions.toLocaleString()}</div></div>
      <div class="data-card"><div class="lbl">수집된 라운드</div><div class="val">${totalRounds.toLocaleString()}</div></div>
      <div class="data-card"><div class="lbl">AI 승률</div><div class="val">${(aiWins/total*100).toFixed(0)}%</div></div>
    </div>
    <div class="panel" style="margin-bottom:24px;">
      <h3>참가자 순위 TOP 20</h3>
      ${ranking.length ? `<div class="rank-list">${rankHTML}</div>` : `<div class="empty">아직 순위 데이터가 없습니다.</div>`}
    </div>
    <div class="panel" style="margin-bottom:24px;">
      <h3>인간 vs AI 승률</h3>
      <div style="display:flex; height:26px; border-radius:6px; overflow:hidden; margin-top:14px;">
        <div style="width:${humanWins/total*100}%; background:var(--gold);"></div>
        <div style="width:${aiWins/total*100}%; background:var(--red);"></div>
        <div style="width:${ties/total*100}%; background:#3a332f;"></div>
      </div>
      <div style="display:flex; gap:20px; margin-top:12px; font-size:12px; color:var(--muted);">
        <div>🟡 인간 ${(humanWins/total*100).toFixed(1)}% (${humanWins}건)</div>
        <div>🔴 AI ${(aiWins/total*100).toFixed(1)}% (${aiWins}건)</div>
        <div>⚪ 무승부 ${(ties/total*100).toFixed(1)}% (${ties}건)</div>
      </div>
    </div>
    <div class="panel">
      <div class="data-toolbar">
        <h3 style="margin:0;">전체 세션 원자료 (${totalSessions}건)</h3>
        <div style="display:flex; gap:8px;">
          <button class="btn-ghost" data-action="export-json">⬇ JSON 다운로드</button>
          <button class="btn-ghost" data-action="export-csv">⬇ CSV 다운로드 (라운드 단위)</button>
        </div>
      </div>
      ${totalSessions===0
        ? `<div class="empty">아직 수집된 데이터가 없습니다. 게임에 참여하면 이곳에 누적됩니다.</div>`
        : `<div class="table-scroll"><table>
             <thead><tr><th>참가자 ID</th><th>일시</th><th>내 점수</th><th>AI 점수</th><th>라운드</th><th>결과</th></tr></thead>
             <tbody>${rowsHTML}</tbody>
           </table></div>`
      }
    </div>
  </div>`;
}

function renderAbout(){
  return `<div class="wrap page">
    <div class="page-head"><h2>연구 소개</h2></div>
    <div class="about-block">
      <h3>연구 목적</h3>
      <p>NeuroRoulette은 확률적 보상 환경에서 인간의 의사결정 전략과 강화학습(Q-learning) 알고리즘의 학습 전략을 나란히 비교하는 플랫폼입니다. 각 라운드마다 룰렛의 "핫 세그먼트"는 규칙에 따라 이동하며, 참여자는 제한된 힌트만으로 이 패턴을 추론해야 합니다.</p>
    </div>
    <div class="about-block">
      <h3>Q-learning 에이전트</h3>
      <p>AI는 ε-greedy 정책을 사용해 매 라운드 세그먼트를 선택하고, 받은 보상을 바탕으로 Q(a) ← Q(a) + α(r − Q(a)) 규칙으로 가치를 갱신합니다. 라운드가 진행될수록 탐험률(ε)이 감소해 점점 더 학습된 선택을 하게 됩니다.</p>
    </div>
    <div class="about-block">
      <h3>데이터 & 참가자 식별</h3>
      <p>로그인 절차와 함께 익명 참가자 ID가 자동으로 부여됩니다. 모든 세션 기록은 공유 데이터셋에 누적되며, 권한이 있을 시, "데이터 & 결과" 페이지에서 전체 원자료를 확인하고 JSON/CSV로 내려받을 수 있습니다. 이는 연구·교육용 시뮬레이션입니다.</p>
    </div>
  </div>`;
}

function renderFAQ(){
  const items = [
    ['이 게임은 실제 보상이 있나요?', '네. NeuroRoulette은 보상을 바탕으로 참가를 유도한 연구·교육용 프로젝트입니다.'],
    ['로그인이 필요한가요?', '네. 한민고 이메일로 로그인을 해야하며, 그 후 자동으로 부여되는 익명 참가자 ID로 참여할 수 있습니다.'],
    ['왜 라운드가 7번인가요?', '짧은 시행 안에서도 패턴 학습과 탐색-활용(exploration-exploitation) 딜레마를 관찰할 수 있는 표준적인 길이로 설정했습니다.'],
    ['AI는 어떻게 학습하나요?', 'Q-learning 알고리즘이 매 라운드 보상을 받아 세그먼트별 가치를 갱신하며, 인간과 동일한 룰렛 환경에서 독립적으로 선택합니다.'],
    ['내 데이터는 어디에 저장되나요?', '모든 세션 기록은 익명 참가자 ID와 함께 공유 데이터셋에 저장되며, "데이터 & 결과" 페이지에서 전체가 공개됩니다.'],
    ['패턴 힌트는 어떻게 활용하나요?', '최근 당첨 세그먼트와 누적 빈도를 참고하면 핫 세그먼트가 이동하는 규칙을 추론하는 데 도움이 됩니다.'],
  ];
  return `<div class="wrap page">
    <div class="page-head"><h2>자주 묻는 질문</h2></div>
    ${items.map(([q,a])=>`<div class="faq-item"><h3>${q}</h3><p>${a}</p></div>`).join('')}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(!state.authenticated){
    app.innerHTML = renderLogin();
    return;
  }
  switch(state.view){
    case 'game': body = renderGame(); break;
    case 'survey': body = renderSurvey(); break;
    case 'results': body = renderResults(); break;
    case 'data': body = renderData(); break;
    case 'about': body = renderAbout(); break;
    case 'faq': body = renderFAQ(); break;
    default: body = renderHome();
  }
  app.innerHTML = headerHTML() + body;
  if(state.view==='home') updateHomeStats();
}
async function updateHomeStats(){
  try{
    await loadAllSessions();
    const list = state.allSessions;
    const participants = new Set(list.map(s=>s.participantId)).size;
    const rounds = list.reduce((a,s)=>a+(Array.isArray(s.rounds)?s.rounds.length:0),0);
    const pEl = document.getElementById('home-participants');
    const sEl = document.getElementById('home-sessions');
    const rEl = document.getElementById('home-rounds');
    if(pEl) pEl.textContent = participants.toLocaleString();
    if(sEl) sEl.textContent = list.length.toLocaleString();
    if(rEl) rEl.textContent = rounds.toLocaleString();
  }catch(e){}
}

/* ---------- 이벤트 위임 ---------- */
document.getElementById('app').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  const action = el.dataset.action;
  switch(action){
    case 'goto': goto(el.dataset.view); break;
    case 'start-game': startGame(); break;
    case 'select-seg': selectSegment(Number(el.dataset.idx)); break;
    case 'spin': spin(); break;
    case 'next-round': nextRound(); break;
    case 'survey-pick':
      state.survey[el.dataset.key] = Number(el.dataset.val);
      render();
      break;
    case 'finish-save': finishAndSave(); break;
    case 'login': login(); break;
    case 'logout': logout(); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
  }
});

document.getElementById('app').addEventListener('input', (e)=>{
  if(e.target && e.target.id==='pattern-guess') state.survey.patternGuess = e.target.value;
});
document.getElementById('app').addEventListener('keydown', (e)=>{
  if(e.target && e.target.id==='school-email' && e.key==='Enter'){
    e.preventDefault(); login();
  }
});

/* ---------- 초기화 ---------- */
(async function init(){
  ensureParticipant();
  try{
    const saved=sessionStorage.getItem('nr_school_email')||'';
    const valid=validSchoolEmail(saved);
    if(valid){ state.authenticated=true; state.userEmail=valid; }
  }catch(e){}
  await loadAllSessions();
  render();
})();
</script>
</body>
</html>
